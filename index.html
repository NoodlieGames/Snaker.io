<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snaker.io</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      background: #222;
    }
    #menu {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 2;
    }
    #menu input, #menu button {
      margin: 10px;
      padding: 10px;
      font-size: 20px;
      border: none;
      border-radius: 6px;
    }
    #menu input {
      width: 200px;
      text-align: center;
    }
    #menu button {
      background: lime;
      cursor: pointer;
    }
    #leaderboard {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-size: 18px;
      z-index: 1;
      text-align: right;
    }
  </style>
</head>
<body>

<div id="menu">
  <h1>Snaker.io</h1>
  <input type="text" id="playerName" placeholder="Enter your name">
  <input type="color" id="playerColor" value="#00ff00">
  <button onclick="startGame()">Play</button>
</div>

<div id="leaderboard"></div>
<canvas id="gameCanvas"></canvas>








<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const leaderboardDiv = document.getElementById("leaderboard");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const MAP_SIZE = 20000;
let snake, snakeLength, angle, speed, alive, boosting;
let foods = [];
let bots = [];
let playerName = "YOU";
let playerColor = "lime";

function startGame() {
  playerName = document.getElementById("playerName").value || "YOU";
  playerColor = document.getElementById("playerColor").value;
  menu.style.display = "none";
  initGame();
}

function getRandomBotName() {
  const names = ["Sn4k3r", "WormGod", "NoobSlayer", "Speedy", "Ouroboros", "L33tSnake", "Glizzy", "SnakeEZ", "LagKing", "VenomByte"];
  return names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 100);
}

function spawnBot() {
  bots.push({
    snake: [{x: Math.random() * MAP_SIZE, y: Math.random() * MAP_SIZE}],
    angle: Math.random() * Math.PI * 2,
    speed: 3,
    snakeLength: 10,
    color: `hsl(${Math.random()*360}, 100%, 60%)`,
    alive: true,
    name: getRandomBotName()
  });
}

function initGame() {
  snake = [{x: MAP_SIZE/2, y: MAP_SIZE/2}];
  snakeLength = 5;
  angle = 0;
  speed = 4;
  alive = true;
  boosting = false;

  foods = [];
  bots = [];

  for (let i = 0; i < 1500; i++) {
    foods.push({
      x: Math.random() * MAP_SIZE,
      y: Math.random() * MAP_SIZE,
      color: `hsl(${Math.random()*360}, 100%, 50%)`
    });
  }

  for (let i = 0; i < 20; i++) spawnBot();

  setInterval(() => {
    if (bots.length < 50) spawnBot();
  }, 5000);
}

document.addEventListener("mousemove", (e) => {
  const dx = e.clientX - canvas.width/2;
  const dy = e.clientY - canvas.height/2;
  angle = Math.atan2(dy, dx);
});

document.addEventListener("mousedown", () => boosting = true);
document.addEventListener("mouseup", () => boosting = false);

function dieAndDropFood(parts) {
  for (const part of parts) {
    foods.push({
      x: part.x,
      y: part.y,
      color: `hsl(${Math.random()*360}, 100%, 70%)`
    });
  }
}

function updatePlayer() {
  if (!alive) return;
  const moveSpeed = boosting ? speed * 1.8 : speed;
  const head = {
    x: snake[0].x + Math.cos(angle) * moveSpeed,
    y: snake[0].y + Math.sin(angle) * moveSpeed
  };
  head.x = Math.max(0, Math.min(MAP_SIZE, head.x));
  head.y = Math.max(0, Math.min(MAP_SIZE, head.y));
  snake.unshift(head);
  if (snake.length > snakeLength) snake.pop();

  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    const dist = Math.hypot(f.x - head.x, f.y - head.y);
    if (dist < 20) {
      snakeLength += 2;
      foods.splice(i, 1);
    }
  }

  for (const bot of bots) {
    if (!bot.alive) continue;
    for (let j = 3; j < bot.snake.length; j++) {
      const part = bot.snake[j];
      const dist = Math.hypot(part.x - head.x, part.y - head.y);
      if (dist < 20) {
        alive = false;
        dieAndDropFood(snake);
      }
    }
  }
}

function updateBots() {
  for (const bot of bots) {
    if (!bot.alive) continue;
    const moveSpeed = bot.speed;
    const head = {
      x: bot.snake[0].x + Math.cos(bot.angle) * moveSpeed,
      y: bot.snake[0].y + Math.sin(bot.angle) * moveSpeed
    };
    head.x = Math.max(0, Math.min(MAP_SIZE, head.x));
    head.y = Math.max(0, Math.min(MAP_SIZE, head.y));
    bot.snake.unshift(head);
    if (bot.snake.length > bot.snakeLength) bot.snake.pop();

    if (Math.random() < 0.02) bot.angle += (Math.random() - 0.5) * 0.5;

    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i];
      const dist = Math.hypot(f.x - head.x, f.y - head.y);
      if (dist < 20) {
        bot.snakeLength += 1;
        foods.splice(i, 1);
      }
    }

    for (const other of bots) {
      if (bot === other || !other.alive) continue;
      for (let j = 3; j < other.snake.length; j++) {
        const part = other.snake[j];
        const dist = Math.hypot(part.x - head.x, part.y - head.y);
        if (dist < 20) {
          bot.alive = false;
          dieAndDropFood(bot.snake);
        }
      }
    }

    if (alive) {
      for (let j = 3; j < snake.length; j++) {
        const part = snake[j];
        const dist = Math.hypot(part.x - head.x, part.y - head.y);
        if (dist < 20) {
          bot.alive = false;
          dieAndDropFood(bot.snake);
        }
      }
    }
  }
}

function draw() {
  ctx.fillStyle = "#222";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  if (alive) {
    const camX = snake[0].x - canvas.width/2;
    const camY = snake[0].y - canvas.height/2;
    ctx.translate(-camX, -camY);
  }

  for (const f of foods) {
    ctx.beginPath();
    ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = f.color;
    ctx.fill();
  }

  for (const bot of bots) {
    if (!bot.alive) continue;
    ctx.fillStyle = bot.color;
    for (const part of bot.snake) {
      ctx.beginPath();
      ctx.arc(part.x, part.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    const name = bot.name;
    ctx.fillStyle = "white";
    ctx.fillText(name, bot.snake[0].x - name.length * 2, bot.snake[0].y - 10);
  }

  if (alive) {
    ctx.fillStyle = playerColor;
    for (const part of snake) {
      ctx.beginPath();
      ctx.arc(part.x, part.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "white";
    ctx.fillText(playerName, snake[0].x - playerName.length * 2, snake[0].y - 10);
  }
  ctx.restore();
}

function updateLeaderboard() {
  let scores = bots.filter(b => b.alive).map(b => ({name: b.name, score: b.snake.length}))
  if (alive) scores.push({name: playerName, score: snake.length});
  scores.sort((a, b) => b.score - a.score);
  leaderboardDiv.innerHTML = "<b>Leaderboard:</b><br>" + scores.slice(0, 10).map(s => `${s.name}: ${s.score}`).join("<br>");
}



// === SECRET CODE TO UNLOCK ADMIN PANEL ===
let secretCode = "";
const targetCode = "skibidiisbetterthanaot";

document.addEventListener("keydown", function (e) {
    secretCode += e.key;
    if (secretCode.length > targetCode.length) {
        secretCode = secretCode.slice(-targetCode.length);
    }

    if (secretCode === targetCode) {
        document.getElementById("adminPanel").style.display = "block";
        updateBotCount();
    }
});

// === ADMIN PANEL HTML ===
const adminPanel = document.createElement("div");
adminPanel.id = "adminPanel";
adminPanel.style = `
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 9999;
    max-width: 300px;
    display: none;
`;

adminPanel.innerHTML = `
    <h3 style="margin-top: 0;">Admin Panel</h3>
    <div id="botCount">Bots: 0</div><br>
    <label>Game Speed: <input id="gameSpeedInput" type="number" value="2" step="0.5" min="0.5" max="10"></label><br><br>
    <button onclick="spawnBots(1)">Add 1 Bot</button>
    <button onclick="spawnBots(5)">Add 5 Bots</button>
    <button onclick="killAllBots()">Kill All Bots</button><br><br>
    <button onclick="togglePause()">Pause / Resume</button>
    <button onclick="kickAllSnakes()">Kick All</button><br><br>
    <label>Bot Behavior:
        <select id="botBehaviorSelect" onchange="changeBotBehavior(this.value)">
            <option value="random">Random</option>
            <option value="aggressive">Aggressive</option>
            <option value="passive">Passive</option>
        </select>
    </label><br><br>
    <label>Auto Spawn Bots: <input id="autoSpawnToggle" type="checkbox" onchange="toggleAutoSpawn(this.checked)"></label><br><br>
    <label>Food Spawn Rate: <input id="foodRateInput" type="number" value="1" step="0.1" min="0.1" max="10"></label><br><br>
    <button onclick="clearAllFood()">Clear Food</button><br><br>
    <button onclick="toggleGrid()">Toggle Grid</button>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button><br><br>
    <button onclick="closeAdmin()">Close Panel</button>
`;

document.body.appendChild(adminPanel);

// === PANEL FUNCTIONS ===
function killAllBots() {
    bots = [];
    updateBotCount();
}

function spawnBots(count) {
    for (let i = 0; i < count; i++) spawnBot(); // must have spawnBot()
    updateBotCount();
}

function updateBotCount() {
    const counter = document.getElementById("botCount");
    if (counter) counter.innerText = "Bots: " + (bots?.length || 0);
}

function closeAdmin() {
    document.getElementById("adminPanel").style.display = "none";
}

let paused = false;
function togglePause() {
    paused = !paused;
}

function kickAllSnakes() {
    snakes = [];
    bots = [];
    updateBotCount();
}

function changeBotBehavior(mode) {
    bots.forEach(bot => bot.mode = mode); // You must support bot.mode
}

let autoSpawnBots = false;
function toggleAutoSpawn(value) {
    autoSpawnBots = value;
}

function clearAllFood() {
    food = [];
}

let showGrid = true;
function toggleGrid() {
    showGrid = !showGrid;
}

let darkMode = false;
function toggleDarkMode() {
    darkMode = !darkMode;
    document.body.style.backgroundColor = darkMode ? "#111" : "#fff";
    canvas.style.background = darkMode ? "#222" : "#fafafa";
}

function updateGameSpeed() {
    let input = document.getElementById("gameSpeedInput");
    if (input) gameSpeed = parseFloat(input.value); // gameSpeed must be used
}

function updateFoodRate() {
    let rate = parseFloat(document.getElementById("foodRateInput").value);
    foodSpawnRate = rate; // implement in your food logic
}



function gameLoop() {
  updatePlayer();
  updateBots();
  draw();
  updateLeaderboard();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
<div id="adminPanel" style="display:none; position:fixed; top:20px; right:20px; background:#111; color:white; padding:20px; border-radius:10px; z-index:9999;">
  <h2>Admin Panel</h2>
  <p id="botCount">Bots: 0</p>
  <button onclick="killAllBots()">Kill All Bots</button>
  <button onclick="spawnBots(10)">Spawn 10 Bots</button>
  <button onclick="closeAdmin()">Close</button>
</div>

</body>
</html>
